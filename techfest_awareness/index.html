<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Tech Fest 2026 | Lucky Draw</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="page"><section class="card">
<div class="badge">TECH FEST 2026</div>
<h1>Lucky Draw Registration</h1>
<p class="subtitle">Enter your details to participate in the Tech Fest lucky draw.</p>
<form id="drawForm">
<label for="name">Name</label><input id="name" maxlength="80" required>
<label for="email">Email</label><input id="email" type="email" maxlength="120" required>
<label for="mobile">Mobile Number</label><input id="mobile" type="tel" maxlength="20" required>
<label for="place">Place</label><input id="place" maxlength="100" required>
<button type="submit">Enter Lucky Draw</button>
</form>
<p id="message" class="message" aria-live="polite"></p>
</section></main>
<script src="script.js"></script>
</body>
</html>
